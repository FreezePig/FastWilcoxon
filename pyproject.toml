[build-system]
requires = [
    "scikit-build-core",
    "pybind11",
    "numpy>=1.24,<1.26; python_version < '3.9'",
    "numpy>=1.26,<2.3; python_version >= '3.9'",
    "mkl-static==2025.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mkl-include==2025.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "FastWilcoxon"
version = "0.1.0"

requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24,<1.26; python_version < '3.9'",
    "numpy>=1.26,<3; python_version >= '3.9'",
    "pandas",
    "anndata",
    "scipy>=1.10,<2",
    # macOS wheels share this package's libomp with the optional GraphBLAS frontend.
    "suitesparse-graphblas==9.4.5.0; sys_platform == 'darwin' and python_version >= '3.10'",
    "statsmodels",
    "adjustText",
    "matplotlib",
    "seaborn"
]

[project.optional-dependencies]
graphblas = ["python-graphblas==2025.2.0; python_version >= '3.10'"]

[tool.scikit-build]
cmake.version = ">=3.15"

[tool.scikit-build.wheel]
install-dir = "fastwilcoxon"
packages = ["fastwilcoxon"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.cibuildwheel]
# skip PyPy and musllinux, only build CPython
skip = ["pp*", "*-musllinux*", "*i686", "*-manylinux_aarch64"]
build-verbosity = 1
before-test = "pip install --only-binary=h5py,scipy h5py scipy"
test-extras = ["graphblas"]
test-command = 'python "{project}/tests/wheel_smoke_csr_to_csc.py"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "yum install -y libgomp"
before-test = "pip install --only-binary=numpy,h5py,scipy 'numpy<2.3' h5py 'scipy<1.17'"
environment = { PIP_ONLY_BINARY = ":all:" }

[tool.cibuildwheel.macos]
repair-wheel-command = 'python cmake/repair_macos_wheel.py "{wheel}" "{dest_dir}" "{delocate_archs}"'

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --add-path external\\OpenBLAS\\x64\\bin"